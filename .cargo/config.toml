[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-pc-windows-msvc]
# Keep the optional native speech engine from requiring a separate VC++ runtime.
rustflags = ["-C", "target-feature=+crt-static"]

[env]
# Portable CPU kernels avoid tying releases to the build machine's instruction set.
GGML_NATIVE = "OFF"
GGML_AVX = "OFF"
GGML_AVX2 = "OFF"
GGML_FMA = "OFF"
GGML_F16C = "OFF"
CMAKE_POLICY_DEFAULT_CMP0091 = "NEW"
CMAKE_MSVC_RUNTIME_LIBRARY = "MultiThreaded"
