[workspace]
resolver = "2"

[package]
name = "quaternio"
version = "0.1.0-beta.5"
edition = "2021"
rust-version = "1.92"
description = "Quaternio, a native desktop editor for media, cut, grade, and export."
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
# FemtoVG first for Linux/Wayland input+redraw; software remains as fallback.
i-slint-backend-winit = { version = "=1.18.1", default-features = false, features = ["renderer-femtovg", "renderer-software"] }
rfd = "0.15"
rayon = "1.12"
rodio = "0.19"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
slint = { version = "=1.18.1", default-features = false, features = ["renderer-femtovg", "renderer-software", "backend-winit", "std", "compat-1-2"] }
roxmltree = "0.21.1"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
semver = "1"
open = "5"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
fs2 = "0.4"
webrtc = "=0.21.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
async-trait = "0.1"
bytes = "1"
base64 = "0.22"
subtle = "2.6"

[target.'cfg(target_os = "linux")'.dependencies]
xz2 = "0.1"

[build-dependencies]
embed-resource = "3.0"
slint-build = "=1.18.1"
