[workspace]
resolver = "2"

[package]
name = "quaternio"
version = "0.1.0-beta.9"
edition = "2021"
rust-version = "1.92"
description = "Quaternio, a native desktop editor for media, cut, grade, and export."
license = "MIT"
publish = false

[dependencies]
ab_glyph = "=0.2.32"
anyhow = "1"
# FemtoVG first for Linux/Wayland input+redraw; software remains as fallback.
i-slint-backend-winit = { version = "=1.18.1", default-features = false, features = ["renderer-femtovg", "renderer-software", "accessibility"] }
rfd = "0.15"
rayon = "1.12"
rodio = { version = "0.19", default-features = false }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
slint = { version = "=1.18.1", default-features = false, features = ["renderer-femtovg", "renderer-software", "backend-winit", "std", "compat-1-2", "accessibility"] }
roxmltree = "0.21.1"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
semver = "1"
open = "5"
zip = { version = "9", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
fs2 = "0.4"
webrtc = "=0.21.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net"] }
async-trait = "0.1"
bytes = "1"
base64 = "0.22"
subtle = "2.6"
futures-util = { version = "=0.3.34", features = ["sink"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
image = { version = "=0.25.10", default-features = false, features = ["jpeg"] }
whisper-rs = { version = "=0.16.0", default-features = false }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "vulkan", "wgsl"] }
pollster = "0.4"
bytemuck = "1"

[target.'cfg(target_os = "linux")'.dependencies]
xz2 = "0.1"

[build-dependencies]
embed-resource = "3.0"
slint-build = "=1.18.1"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
