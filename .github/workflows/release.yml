# Tag-triggered multi-OS release. Jobs listed Windows → Linux → macOS (priority).
# Media tools are installed separately at runtime; app archives contain no FFmpeg payload.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  version:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match tag to application version
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open("Cargo.toml", "rb") as source:
              version = tomllib.load(source)["package"]["version"]
          expected = "v" + version
          if os.environ["GITHUB_REF_NAME"] != expected:
              raise SystemExit(f"Release tag must be {expected}")
          PY

  windows:
    needs: version
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build release
        run: cargo build --release --locked

      - name: Stage and package
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          New-Item -ItemType Directory -Force -Path packaging/stage, dist | Out-Null
          Copy-Item target/release/quaternio.exe packaging/stage/quaternio.exe
          Copy-Item LICENSE packaging/stage/LICENSE

          $portable = "dist/Quaternio-Windows-Portable-$tag.zip"
          if (Test-Path $portable) { Remove-Item $portable }
          Compress-Archive -Path packaging/stage/* -DestinationPath $portable

          $makensis = @(
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "$env:ProgramFiles\NSIS\makensis.exe",
            (Get-Command makensis -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source)
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $makensis) { throw "makensis.exe not found after NSIS install" }
          Push-Location packaging
          & $makensis "/DAPP_VERSION=$($tag.TrimStart('v'))" quaternio.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit $LASTEXITCODE" }
          Pop-Location
          # OutFile in quaternio.nsi is ..\dist\Quaternio-Setup.exe
          Move-Item -Force dist/Quaternio-Setup.exe "dist/Quaternio-Setup-$tag.exe"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Quaternio-Windows-Portable-*.zip
            dist/Quaternio-Setup-*.exe

  linux:
    needs: version
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Slint/winit apt deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libfontconfig-dev libx11-xcb-dev libxcursor-dev \
            libxkbcommon-x11-dev libx11-dev libwayland-dev \
            libasound2-dev libegl1-mesa-dev libgl1-mesa-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build release
        run: cargo build --release --locked

      - name: Package tar.gz
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME="Quaternio-Linux-x86_64-${TAG}"
          STAGE="packaging/stage/${NAME}"
          mkdir -p "$STAGE" dist
          cp target/release/quaternio "$STAGE/quaternio"
          cp LICENSE "$STAGE/LICENSE"
          chmod +x "$STAGE/quaternio"
          tar -czf "dist/${NAME}.tar.gz" -C packaging/stage "$NAME"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/Quaternio-Linux-x86_64-*.tar.gz

  macos:
    needs: version
    name: macOS (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build release
        run: cargo build --release --locked

      - name: Package unsigned tar.gz
        run: |
          TAG="${GITHUB_REF_NAME}"
          ARCH="$(uname -m)"
          NAME="Quaternio-macOS-${ARCH}-${TAG}"
          STAGE="packaging/stage/${NAME}"
          mkdir -p "$STAGE" dist
          cp target/release/quaternio "$STAGE/quaternio"
          cp LICENSE "$STAGE/LICENSE"
          chmod +x "$STAGE/quaternio"
          codesign -s - "$STAGE/quaternio" || true
          tar -czf "dist/${NAME}.tar.gz" -C packaging/stage "$NAME"
          echo "Packed ${NAME}.tar.gz (uname -m = ${ARCH})"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.os }}
          path: dist/Quaternio-macOS-*.tar.gz

  publish:
    name: Publish GitHub Release
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        id: files
        run: |
          mkdir -p release
          find artifacts -type f \( \
            -name 'Quaternio-Windows-Portable-*.zip' -o \
            -name 'Quaternio-Setup-*.exe' -o \
            -name 'Quaternio-Linux-x86_64-*.tar.gz' -o \
            -name 'Quaternio-macOS-*.tar.gz' \
          \) -exec cp {} release/ \;
          ls -la release/
          COUNT="$(find release -type f | wc -l | tr -d ' ')"
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          # Expect: Win zip + Setup + Linux tar + both macOS architectures = 5
          if [ "$COUNT" -ne 5 ]; then
            echo "Expected 5 release files, found ${COUNT}" >&2
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Quaternio ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
